name: Upload Release Asset

on:
  release:
    types: [published]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build

      - name: Upload wheel to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/legunto-*.whl
